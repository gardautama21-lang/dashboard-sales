<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Sales SMT - Kantin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }
  .dashboard {
    width: 100vw;
    height: 100vh;
    padding: 14px 18px 14px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 8px;
    border-bottom: 2px solid #1e293b;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 0.5px;
  }
  .header .right-block { text-align: right; }
  .header .clock {
    font-size: 22px;
    font-weight: 600;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .header .status {
    font-size: 11px;
    color: #64748b;
    display: block;
  }

  /* ============ GRID UTAMA ============ */
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 1.15fr 1.15fr 0.7fr;
    gap: 8px;
    min-height: 0;
  }

  /* ============ KOTAK ============ */
  .box {
    background: #1e293b;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    border: 1px solid #334155;
  }
  .box-title {
    padding: 6px 10px;
    font-size: 13px;
    font-weight: 700;
    color: #38bdf8;
    background: #0f172a;
    border-bottom: 1px solid #334155;
    flex-shrink: 0;
    letter-spacing: 0.3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .box-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;
    padding: 6px;
    min-height: 0;
  }
  .box-scroll::-webkit-scrollbar { display: none; }

  /* Posisi grid */
  .box-leaderboard { grid-column: 1 / 3; grid-row: 1; }
  .box-fulllist   { grid-column: 3 / 5; grid-row: 1; }
  .box-furn       { grid-column: 1;     grid-row: 2; }
  .box-acc        { grid-column: 2;     grid-row: 2; }
  .box-fp         { grid-column: 3;     grid-row: 2; }
  .box-commser    { grid-column: 4;     grid-row: 2; }
  .box-summary    { grid-column: 1 / 5; grid-row: 3; }

  /* ============ LEADERBOARD ============ */
  .leaderboard-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .leaderboard-card {
    background: #334155;
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    border-left: 4px solid #38bdf8;
  }
  .leaderboard-card.rank-1 { border-left-color: #fbbf24; background: linear-gradient(135deg, #334155, #422006); }
  .leaderboard-card.rank-2 { border-left-color: #cbd5e1; }
  .leaderboard-card.rank-3 { border-left-color: #b45309; }
  .leaderboard-card .lb-top {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .leaderboard-card .lb-photo {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid #38bdf8;
    flex-shrink: 0;
    background: #1e293b;
  }
  .leaderboard-card.rank-1 .lb-photo { border-color: #fbbf24; }
  .leaderboard-card.rank-2 .lb-photo { border-color: #cbd5e1; }
  .leaderboard-card.rank-3 .lb-photo { border-color: #b45309; }
  .leaderboard-card .lb-name-block { flex: 1; min-width: 0; }
  .leaderboard-card .rank { font-size: 10px; font-weight: 700; color: #38bdf8; }
  .leaderboard-card.rank-1 .rank { color: #fbbf24; }
  .leaderboard-card .name {
    font-size: 12px;
    font-weight: 600;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .leaderboard-card .achievement {
    font-size: 15px;
    font-weight: 800;
    color: #f8fafc;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .leaderboard-card .target { font-size: 9px; color: #94a3b8; }
  .leaderboard-card .pct { font-size: 12px; font-weight: 700; }
  .pct.green { color: #4ade80; }
  .pct.yellow { color: #facc15; }
  .pct.red { color: #f87171; }

  /* ============ TABLE ============ */
  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 11px;
  }
  .data-table thead th {
    background: #0f172a;
    color: #94a3b8;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 4px 6px;
    text-align: left;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 1px solid #334155;
  }
  .data-table tbody td {
    padding: 4px 6px;
    font-size: 11px;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
    border-bottom: 1px solid #334155;
  }
  .data-table tbody tr:nth-child(even) td { background: #263449; }
  .data-table .col-name { font-weight: 600; color: #f1f5f9; }
  .data-table .col-rank { width: 22px; color: #38bdf8; font-weight: 700; text-align: center; }
  .data-table .col-num { text-align: right; }
  .data-table .col-pct { text-align: right; font-weight: 700; }

  /* ============ SUMMARY ============ */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    height: 100%;
    align-items: center;
  }
  .summary-card {
    background: #334155;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .summary-card .big-number {
    font-size: 22px;
    font-weight: 800;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .summary-card .label {
    font-size: 9px;
    color: #94a3b8;
    margin-top: 3px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  /* ============ ERROR ============ */
  .error-box {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #7f1d1d;
    color: #fecaca;
    padding: 20px 40px;
    border-radius: 12px;
    font-size: 16px;
    text-align: center;
    display: none;
    z-index: 100;
    max-width: 70%;
  }
  .error-box.show { display: block; }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1>📊 PENCAPAIAN SALES - SMT</h1>
    <div class="right-block">
      <span class="clock" id="clock">--:--:--</span>
      <span class="status" id="status">Memuat data...</span>
    </div>
  </div>

  <div class="grid">
    <div class="box box-leaderboard">
      <div class="box-title">🏆 SEMUA SMT — PERINGKAT</div>
      <div class="box-scroll" id="leaderboardGrid"></div>
    </div>

    <div class="box box-fulllist">
      <div class="box-title">📋 SEMUA SMT — TARGET & ACHIEVEMENT</div>
      <div class="box-scroll" id="fullList"></div>
    </div>

    <div class="box box-furn">
      <div class="box-title">🛋️ FURNITURE</div>
      <div class="box-scroll" id="furnList"></div>
    </div>

    <div class="box box-acc">
      <div class="box-title">🎁 ACCESSORIES</div>
      <div class="box-scroll" id="accList"></div>
    </div>

    <div class="box box-fp">
      <div class="box-title">🎯 FP</div>
      <div class="box-scroll" id="fpList"></div>
    </div>

    <div class="box box-commser">
      <div class="box-title">💼 COMMSER</div>
      <div class="box-scroll" id="commserList"></div>
    </div>

    <div class="box box-summary">
      <div class="box-title">📈 RINGKASAN TIM</div>
      <div class="box-scroll">
        <div class="summary-grid" id="summaryGrid"></div>
      </div>
    </div>
  </div>

  <div class="error-box" id="errorBox"></div>
</div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const SHEET_ID = '1_R03xSTGWXrQ9YfbREEOzp4PO2pQxo5RJhoSFtR87eY';
const GID = '207779196';
const REFRESH_INTERVAL = 120000;        // 2 menit
const TIMEZONE = 'Asia/Jakarta';        // UTC+7 (WIB)

// --- Pengaturan scroll tiap kotak ---
const SCROLL_SPEED_PX_PER_SEC = 25;     // kecepatan scroll (px/detik)
const SCROLL_HOLD_BOTTOM_MS = 2000;     // tahan di bawah sebelum balik ke atas
const SCROLL_HOLD_TOP_MS = 1200;        // tahan di atas sebelum scroll lagi
const SCROLL_TICK_MS = 50;              // resolusi animasi

const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100">' +
  '<rect width="100" height="100" fill="#1e293b"/>' +
  '<text x="50%" y="62%" font-size="40" fill="#94a3b8" text-anchor="middle" font-family="Arial">👤</text>' +
  '</svg>'
);

// ============================================================
// FETCH & PARSER
// ============================================================
async function fetchSheetData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const json = JSON.parse(jsonText);
  if (json.status === 'error') throw new Error(json.errors[0].detailed_message);
  return json.table;
}
function parseTable(table) {
  const cols = table.cols.map(c => (c.label || '').toString().trim());
  return table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => {
      obj[cols[i]] = cell && cell.v !== undefined && cell.v !== null ? cell.v : '';
    });
    return obj;
  });
}

// ============================================================
// FOTO
// ============================================================
function extractDriveId(url) {
  if (!url) return null;
  const s = url.toString();
  const m = s.match(/\/d\/([a-zA-Z0-9_-]{10,})/) || s.match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m ? m[1] : null;
}
function driveImageUrl(url, size = 200) {
  const id = extractDriveId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}=w${size}` : PLACEHOLDER;
}

// ============================================================
// UTILITY
// ============================================================
function formatCurrency(value) {
  const n = Number(value) || 0;
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1) + ' M';
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + ' Jt';
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + ' Rb';
  return n.toFixed(0);
}
function pctClass(p) { return p >= 100 ? 'green' : p >= 85 ? 'yellow' : 'red'; }
function toPct(v) { const n = Number(v) || 0; return n > 1.5 ? n : n * 100; }
function escapeHtml(s) {
  return (s == null ? '' : s.toString())
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nowTime() {
  return new Date().toLocaleTimeString('id-ID', { hour12: false, timeZone: TIMEZONE });
}
function pick(row, ...names) {
  for (const n of names) {
    if (row[n] !== undefined && row[n] !== '') return row[n];
  }
  return '';
}

// ============================================================
// RENDER: LEADERBOARD — SEMUA SMT
// ============================================================
function renderLeaderboard(rows) {
  const sorted = [...rows]
    .filter(r => Number(pick(r, 'Target')) > 0)
    .sort((a, b) => toPct(pick(b, '%')) - toPct(pick(a, '%')));

  const html = '<div class="leaderboard-grid">' + sorted.map((p, i) => {
    const rank = i + 1;
    const pct = toPct(pick(p, '%'));
    const photo = driveImageUrl(pick(p, 'PHOTOS'), 100);
    return `
      <div class="leaderboard-card rank-${rank}">
        <div class="lb-top">
          <img class="lb-photo" src="${photo}" alt="${escapeHtml(pick(p, 'NAMA'))}"
               onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
          <div class="lb-name-block">
            <div class="rank">#${rank}</div>
            <div class="name">${escapeHtml(pick(p, 'NAMA') || '-')}</div>
          </div>
        </div>
        <div class="achievement">${formatCurrency(pick(p, 'ACHIEVEMENT'))}</div>
        <div class="target">Target: ${formatCurrency(pick(p, 'Target'))}</div>
        <div class="pct ${pctClass(pct)}">${pct.toFixed(1)}%</div>
      </div>`;
  }).join('') + '</div>';

  document.getElementById('leaderboardGrid').innerHTML = html;
}

// ============================================================
// RENDER: TABEL GENERIK
// ============================================================
function buildTable(rows, cols, sortBy = 'pct') {
  let data = [...rows];

  if (sortBy === 'pct') {
    const pctKey = cols.find(c => c.type === 'pct')?.key;
    if (pctKey) data.sort((a, b) => toPct(pick(b, pctKey)) - toPct(pick(a, pctKey)));
  } else if (sortBy === 'value') {
    const key = cols.find(c => c.type === 'num')?.key;
    if (key) data.sort((a, b) => (Number(pick(b, key)) || 0) - (Number(pick(a, key)) || 0));
  } else if (sortBy === 'name') {
    data.sort((a, b) => (pick(a, 'NAMA') || '').toString().localeCompare(pick(b, 'NAMA') || ''));
  }

  let html = '<table class="data-table"><thead><tr>';
  html += '<th class="col-rank">#</th>';
  cols.forEach(c => {
    const cls = c.type === 'num' || c.type === 'pct' ? 'col-num' : (c.type === 'name' ? 'col-name' : '');
    html += `<th class="${cls}">${c.label}</th>`;
  });
  html += '</tr></thead><tbody>';

  data.forEach((row, i) => {
    html += '<tr>';
    html += `<td class="col-rank">${i + 1}</td>`;
    cols.forEach(c => {
      const raw = pick(row, c.key);
      if (c.type === 'num') {
        html += `<td class="col-num">${formatCurrency(raw)}</td>`;
      } else if (c.type === 'pct') {
        const pct = toPct(raw);
        html += `<td class="col-pct ${pctClass(pct)}">${pct.toFixed(1)}%</td>`;
      } else {
        html += `<td class="${c.type === 'name' ? 'col-name' : ''}">${escapeHtml(raw || '-')}</td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

// ============================================================
// RENDER SEMUA KOTAK
// ============================================================
let CLEAN_DATA = [];

function renderAllBoxes() {
  const clean = CLEAN_DATA;

  renderLeaderboard(clean);

  document.getElementById('fullList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'Target', label: 'Target', type: 'num' },
    { key: 'ACHIEVEMENT', label: 'Achieve', type: 'num' },
    { key: '%', label: '%', type: 'pct' }
  ], 'pct');

  document.getElementById('furnList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'ACTUAL FURN', label: 'Actual', type: 'num' },
    { key: '% FURN', label: '%', type: 'pct' }
  ], 'pct');

  document.getElementById('accList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'ACTUAL ACC', label: 'Actual', type: 'num' },
    { key: '% ACC', label: '%', type: 'pct' }
  ], 'pct');

  document.getElementById('fpList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'ACTUAL FP', label: 'Actual', type: 'num' }
  ], 'value');

  document.getElementById('commserList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'ACTUAL COMMSER', label: 'Actual', type: 'num' }
  ], 'value');

  // Summary
  const valid = clean.filter(r => Number(pick(r, 'Target')) > 0);
  const totalTarget = valid.reduce((s, p) => s + (Number(pick(p, 'Target')) || 0), 0);
  const totalAchieve = valid.reduce((s, p) => s + (Number(pick(p, 'ACHIEVEMENT')) || 0), 0);
  const totalPct = totalTarget ? (totalAchieve / totalTarget) * 100 : 0;
  const star = valid.filter(p => (pick(p, 'KATEGORI') || '').toString().toLowerCase().trim() === 'star').length;
  const avg  = valid.filter(p => (pick(p, 'KATEGORI') || '').toString().toLowerCase().trim() === 'average').length;
  const poor = valid.filter(p => (pick(p, 'KATEGORI') || '').toString().toLowerCase().trim() === 'poor').length;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><div class="big-number">${formatCurrency(totalTarget)}</div><div class="label">Total Target</div></div>
    <div class="summary-card"><div class="big-number">${formatCurrency(totalAchieve)}</div><div class="label">Total Achieve</div></div>
    <div class="summary-card"><div class="big-number" style="color:${totalPct>=100?'#4ade80':totalPct>=85?'#facc15':'#f87171'}">${totalPct.toFixed(1)}%</div><div class="label">Overall</div></div>
    <div class="summary-card"><div class="big-number" style="color:#4ade80">${star}</div><div class="label">⭐ Star</div></div>
    <div class="summary-card"><div class="big-number" style="color:#facc15">${avg}</div><div class="label">📊 Avg</div></div>
    <div class="summary-card"><div class="big-number" style="color:#f87171">${poor}</div><div class="label">⚠️ Poor</div></div>
  `;
}

// ============================================================
// AUTO SCROLL — TIAP KOTAK INDEPENDEN
// ============================================================
const scrollStates = new WeakMap();

function initScrollFor(scroller) {
  if (scrollStates.has(scroller)) return;
  const state = { pos: 0, phase: 'scrolling', pauseUntil: 0 };
  scrollStates.set(scroller, state);

  setInterval(() => {
    const now = Date.now();
    if (now < state.pauseUntil) return;

    const maxScroll = scroller.scrollHeight - scroller.clientHeight;

    // Jika konten pendek → tidak perlu scroll
    if (maxScroll <= 5) {
      if (state.pos !== 0 || scroller.scrollTop !== 0) {
        state.pos = 0;
        scroller.scrollTop = 0;
      }
      return;
    }

    // Jika sedang fase reset (jeda di bawah sudah selesai)
    if (state.phase === 'reset') {
      state.pos = 0;
      scroller.scrollTop = 0;
      state.phase = 'scrolling';
      state.pauseUntil = now + SCROLL_HOLD_TOP_MS;
      return;
    }

    // Scroll naik pelan
    const step = (SCROLL_SPEED_PX_PER_SEC * SCROLL_TICK_MS) / 1000;
    state.pos = Math.min(state.pos + step, maxScroll);
    scroller.scrollTop = state.pos;

    // Sudah sampai bawah → pause & reset
    if (state.pos >= maxScroll) {
      state.pauseUntil = now + SCROLL_HOLD_BOTTOM_MS;
      state.phase = 'reset';
    }
  }, SCROLL_TICK_MS);
}

function initAllScrolls() {
  document.querySelectorAll('.box-scroll').forEach(scroller => {
    initScrollFor(scroller);
  });
}

function resetAllScrolls() {
  document.querySelectorAll('.box-scroll').forEach(scroller => {
    const state = scrollStates.get(scroller);
    if (state) {
      state.pos = 0;
      state.phase = 'scrolling';
      state.pauseUntil = 0;
    }
    scroller.scrollTop = 0;
  });
}

// ============================================================
// JAM
// ============================================================
function updateClock() {
  document.getElementById('clock').textContent = nowTime();
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// INIT & AUTO REFRESH
// ============================================================
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('errorBox');

async function loadAndRender() {
  try {
    statusEl.textContent = 'Memuat...';
    const table = await fetchSheetData();
    const rows = parseTable(table);
    CLEAN_DATA = rows.filter(r => (pick(r, 'NAMA') || '').toString().trim() !== '');
    if (CLEAN_DATA.length === 0) throw new Error('Tidak ada data di sheet.');

    renderAllBoxes();
    resetAllScrolls();

    statusEl.textContent = `✓ ${CLEAN_DATA.length} sales · update ${nowTime()}`;
    errorBox.classList.remove('show');
    console.log('[OK] Data loaded:', CLEAN_DATA.length, 'rows');
  } catch (e) {
    console.error('[ERR]', e);
    statusEl.textContent = '⚠ Gagal memuat';
    errorBox.textContent = '⚠ Gagal memuat data: ' + e.message;
    errorBox.classList.add('show');
  }
}

// Mulai scroll engine (akan no-op kalau konten belum ada)
initAllScrolls();

// Load pertama
loadAndRender();

// Auto refresh tiap 2 menit
setInterval(loadAndRender, REFRESH_INTERVAL);
</script>
</body>
</html>
