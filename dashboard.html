<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Sales SMT - Kantin</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }
  .dashboard {
    width: 100vw;
    height: 100vh;
    padding: 24px 40px 50px 40px;
    display: flex;
    flex-direction: column;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 3px solid #1e293b;
    margin-bottom: 20px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 34px;
    font-weight: 700;
    color: #f8fafc;
    letter-spacing: 1px;
  }
  .header .right-block { text-align: right; }
  .header .clock {
    font-size: 30px;
    font-weight: 600;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    display: block;
  }
  .header .status {
    font-size: 14px;
    color: #64748b;
    display: block;
  }
  .slide-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.8s ease-in-out;
    pointer-events: none;
    display: flex;
    flex-direction: column;
  }
  .slide.active {
    opacity: 1;
    pointer-events: auto;
  }
  .slide-title {
    font-size: 26px;
    font-weight: 700;
    color: #38bdf8;
    padding-bottom: 10px;
    border-bottom: 2px solid #1e293b;
    margin-bottom: 14px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }

  /* Scroller (konten yang bisa auto-scroll) */
  .scroller {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    scrollbar-width: none;      /* Firefox */
    -ms-overflow-style: none;   /* IE */
    scroll-behavior: smooth;
  }
  .scroller::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* ---------- LEADERBOARD ---------- */
  .leaderboard-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 18px;
    height: 100%;
  }
  .leaderboard-card {
    background: #1e293b;
    border-radius: 18px;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    border-left: 8px solid #38bdf8;
    animation: slideIn 0.6s ease-out;
  }
  .leaderboard-card.rank-1 { border-left-color: #fbbf24; background: linear-gradient(135deg, #1e293b, #292524); }
  .leaderboard-card.rank-2 { border-left-color: #cbd5e1; }
  .leaderboard-card.rank-3 { border-left-color: #b45309; }
  .leaderboard-card .lb-top {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
  }
  .leaderboard-card .lb-photo {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #38bdf8;
    flex-shrink: 0;
    background: #334155;
  }
  .leaderboard-card.rank-1 .lb-photo { border-color: #fbbf24; }
  .leaderboard-card.rank-2 .lb-photo { border-color: #cbd5e1; }
  .leaderboard-card.rank-3 .lb-photo { border-color: #b45309; }
  .leaderboard-card .lb-name-block { flex: 1; min-width: 0; }
  .leaderboard-card .rank { font-size: 18px; font-weight: 700; color: #38bdf8; }
  .leaderboard-card.rank-1 .rank { color: #fbbf24; }
  .leaderboard-card .name {
    font-size: 18px;
    font-weight: 600;
    color: #f1f5f9;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .leaderboard-card .achievement {
    font-size: 32px;
    font-weight: 800;
    color: #f8fafc;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .leaderboard-card .target { font-size: 14px; color: #94a3b8; margin-top: 4px; }
  .leaderboard-card .pct { font-size: 22px; font-weight: 700; margin-top: 6px; }
  .pct.green { color: #4ade80; }
  .pct.yellow { color: #facc15; }
  .pct.red { color: #f87171; }

  /* ---------- TABLE (untuk FURN, ACC, FP, COMMSER, FULL) ---------- */
  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 6px;
    font-size: 16px;
  }
  .data-table thead th {
    background: #0f172a;
    color: #94a3b8;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    padding: 10px 14px;
    text-align: left;
    position: sticky;
    top: 0;
    z-index: 2;
    border-bottom: 2px solid #1e293b;
  }
  .data-table tbody tr {
    background: #1e293b;
  }
  .data-table tbody td {
    padding: 12px 14px;
    font-size: 16px;
    color: #e2e8f0;
    font-variant-numeric: tabular-nums;
    border-top: 1px solid #334155;
    border-bottom: 1px solid #334155;
  }
  .data-table tbody td:first-child {
    border-left: 6px solid #38bdf8;
    border-top-left-radius: 10px;
    border-bottom-left-radius: 10px;
  }
  .data-table tbody td:last-child {
    border-right: 1px solid #334155;
    border-top-right-radius: 10px;
    border-bottom-right-radius: 10px;
  }
  .data-table .col-name { font-weight: 600; color: #f1f5f9; }
  .data-table .col-rank {
    width: 50px;
    color: #38bdf8;
    font-weight: 700;
    text-align: center;
  }
  .data-table .col-num { text-align: right; }
  .data-table .col-pct { text-align: right; font-weight: 700; font-size: 17px; }
  .data-table .col-badge { text-align: center; width: 120px; }

  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .badge.star { background: #166534; color: #bbf7d0; }
  .badge.average { background: #854d0e; color: #fef08a; }
  .badge.poor { background: #991b1b; color: #fecaca; }
  .badge.ok { background: #166534; color: #bbf7d0; }
  .badge.warn { background: #854d0e; color: #fef08a; }
  .badge.bad { background: #991b1b; color: #fecaca; }

  /* ---------- SUMMARY ---------- */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 20px;
    height: 100%;
  }
  .summary-card {
    background: #1e293b;
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    animation: slideIn 0.6s ease-out;
  }
  .summary-card .big-number {
    font-size: 56px;
    font-weight: 800;
    color: #38bdf8;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .summary-card .label { font-size: 20px; color: #94a3b8; margin-top: 10px; }

  /* ---------- DOTS ---------- */
  .dots {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 10;
  }
  .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: #334155;
    transition: all 0.3s;
  }
  .dot.active { background: #38bdf8; transform: scale(1.3); }

  /* ---------- ERROR ---------- */
  .error-box {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #7f1d1d;
    color: #fecaca;
    padding: 30px 50px;
    border-radius: 16px;
    font-size: 20px;
    text-align: center;
    display: none;
    z-index: 100;
    max-width: 70%;
  }
  .error-box.show { display: block; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="dashboard">
  <div class="header">
    <h1>📊 PENCAPAIAN SALES - SMT</h1>
    <div class="right-block">
      <span class="clock" id="clock">--:--:--</span>
      <span class="status" id="status">Memuat data...</span>
    </div>
  </div>
  <div class="slide-container">
    <!-- Slide 0: Leaderboard -->
    <div class="slide active">
      <div class="slide-title">🏆 TOP 8 — PENCAPAIAN TERTINGGI</div>
      <div class="scroller" id="leaderboardGrid"></div>
    </div>
    <!-- Slide 1: Semua SMT (Target/Achieve/%) -->
    <div class="slide">
      <div class="slide-title">📋 SEMUA SMT — TARGET & ACHIEVEMENT</div>
      <div class="scroller" id="fullList"></div>
    </div>
    <!-- Slide 2: FURN -->
    <div class="slide">
      <div class="slide-title">🛋️ PENCAPAIAN FURNITURE</div>
      <div class="scroller" id="furnList"></div>
    </div>
    <!-- Slide 3: ACC -->
    <div class="slide">
      <div class="slide-title">🎁 PENCAPAIAN ACCESSORIES</div>
      <div class="scroller" id="accList"></div>
    </div>
    <!-- Slide 4: FP -->
    <div class="slide">
      <div class="slide-title">🎯 PENCAPAIAN FP (FURNITURE PRODUCT)</div>
      <div class="scroller" id="fpList"></div>
    </div>
    <!-- Slide 5: COMMSER -->
    <div class="slide">
      <div class="slide-title">💼 PENCAPAIAN COMMSER</div>
      <div class="scroller" id="commserList"></div>
    </div>
    <!-- Slide 6: Summary -->
    <div class="slide">
      <div class="slide-title">📈 RINGKASAN TIM</div>
      <div class="summary-grid" id="summaryGrid"></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="error-box" id="errorBox"></div>
  </div>
</div>

<script>
// ============================================================
// KONFIGURASI
// ============================================================
const SHEET_ID = '1_R03xSTGWXrQ9YfbREEOzp4PO2pQxo5RJhoSFtR87eY';
const GID = '207779196';
const REFRESH_INTERVAL = 120000;   // 2 menit
const SLIDE_DURATION_NO_SCROLL = 10000; // 10 detik jika tidak perlu scroll
const SCROLL_SPEED_PX_PER_SEC = 40;     // kecepatan scroll (px/detik)
const SCROLL_HOLD_BOTTOM = 2500;        // tahan 2,5 detik di bawah
const TIMEZONE = 'Asia/Jakarta';        // UTC+7 (WIB)

const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200">' +
  '<rect width="200" height="200" fill="#334155"/>' +
  '<text x="50%" y="58%" font-size="80" fill="#94a3b8" text-anchor="middle" font-family="Arial">👤</text>' +
  '</svg>'
);

// ============================================================
// FETCH & PARSER
// ============================================================
async function fetchSheetData() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=1`;
  const res = await fetch(url, { cache: 'no-store' });
  const text = await res.text();
  const jsonText = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
  const json = JSON.parse(jsonText);
  if (json.status === 'error') throw new Error(json.errors[0].detailed_message);
  return json.table;
}
function parseTable(table) {
  const cols = table.cols.map(c => (c.label || '').toString().trim());
  return table.rows.map(r => {
    const obj = {};
    r.c.forEach((cell, i) => {
      obj[cols[i]] = cell && cell.v !== undefined && cell.v !== null ? cell.v : '';
    });
    return obj;
  });
}

// ============================================================
// FOTO
// ============================================================
function extractDriveId(url) {
  if (!url) return null;
  const m = url.toString().match(/\/d\/([a-zA-Z0-9_-]{10,})/) || url.toString().match(/[?&]id=([a-zA-Z0-9_-]{10,})/);
  return m ? m[1] : null;
}
function driveImageUrl(url, size = 400) {
  const id = extractDriveId(url);
  return id ? `https://lh3.googleusercontent.com/d/${id}=w${size}` : PLACEHOLDER;
}

// ============================================================
// UTILITY
// ============================================================
function formatCurrency(value) {
  const n = Number(value) || 0;
  if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(1) + ' M';
  if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(1) + ' Jt';
  if (Math.abs(n) >= 1e3) return (n / 1e3).toFixed(0) + ' Rb';
  return n.toFixed(0);
}
function pctClass(p) { return p >= 100 ? 'green' : p >= 85 ? 'yellow' : 'red'; }
function badgeClass(c) { return (c || '').toString().toLowerCase().trim(); }
function toPct(v) { const n = Number(v) || 0; return n > 1.5 ? n : n * 100; }
function escapeHtml(s) {
  return (s == null ? '' : s.toString())
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function nowTime() {
  return new Date().toLocaleTimeString('id-ID', { hour12: false, timeZone: TIMEZONE });
}
// Pilih kolom berdasarkan nama header, dengan fallback ke beberapa nama
function pick(row, ...names) {
  for (const n of names) {
    if (row[n] !== undefined && row[n] !== '') return row[n];
  }
  return '';
}

// ============================================================
// RENDER: LEADERBOARD (Top 8)
// ============================================================
function renderLeaderboard(rows) {
  const sorted = [...rows]
    .filter(r => Number(pick(r, 'Target')) > 0)
    .sort((a, b) => toPct(pick(b, '%')) - toPct(pick(a, '%')))
    .slice(0, 8);

  const html = '<div class="leaderboard-grid">' + sorted.map((p, i) => {
    const rank = i + 1;
    const pct = toPct(pick(p, '%'));
    const photo = driveImageUrl(pick(p, 'PHOTOS'), 200);
    return `
      <div class="leaderboard-card rank-${rank}">
        <div class="lb-top">
          <img class="lb-photo" src="${photo}" alt="${escapeHtml(pick(p, 'NAMA'))}"
               onerror="this.onerror=null;this.src='${PLACEHOLDER}'">
          <div class="lb-name-block">
            <div class="rank">#${rank}</div>
            <div class="name">${escapeHtml(pick(p, 'NAMA') || '-')}</div>
          </div>
        </div>
        <div class="achievement">${formatCurrency(pick(p, 'ACHIEVEMENT'))}</div>
        <div class="target">Target: ${formatCurrency(pick(p, 'Target'))}</div>
        <div class="pct ${pctClass(pct)}">${pct.toFixed(1)}%</div>
      </div>`;
  }).join('') + '</div>';

  document.getElementById('leaderboardGrid').innerHTML = html;
}

// ============================================================
// RENDER: TABEL GENERIK
// ============================================================
// sortBy: 'pct' | 'value' | 'name' | 'none'
function buildTable(rows, cols, sortBy = 'pct') {
  // cols: [{key, label, type: 'num'|'pct'|'name'|'rank'|'badge'|'photo', width?}]

  let data = [...rows];

  if (sortBy === 'pct') {
    data.sort((a, b) => toPct(pick(b, cols[3]?.key || '')) - toPct(pick(a, cols[3]?.key || '')));
  } else if (sortBy === 'value') {
    const key = cols.find(c => c.type === 'num')?.key;
    data.sort((a, b) => (Number(pick(b, key)) || 0) - (Number(pick(a, key)) || 0));
  } else if (sortBy === 'name') {
    data.sort((a, b) => (pick(a, 'NAMA') || '').toString().localeCompare(pick(b, 'NAMA') || ''));
  }

  let html = '<table class="data-table"><thead><tr>';
  html += '<th class="col-rank">#</th>';
  cols.forEach(c => {
    const cls = c.type === 'num' || c.type === 'pct' ? 'col-num' : (c.type === 'badge' ? 'col-badge' : (c.type === 'name' ? 'col-name' : ''));
    html += `<th class="${cls}">${c.label}</th>`;
  });
  html += '</tr></thead><tbody>';

  data.forEach((row, i) => {
    html += '<tr>';
    html += `<td class="col-rank">${i + 1}</td>`;
    cols.forEach(c => {
      const raw = pick(row, c.key);
      if (c.type === 'num') {
        html += `<td class="col-num">${formatCurrency(raw)}</td>`;
      } else if (c.type === 'pct') {
        const pct = toPct(raw);
        html += `<td class="col-pct ${pctClass(pct)}">${pct.toFixed(1)}%</td>`;
      } else if (c.type === 'badge') {
        const cls = pctClass(toPct(raw)) === 'green' ? 'ok' : pctClass(toPct(raw)) === 'yellow' ? 'warn' : 'bad';
        const pct = toPct(raw);
        html += `<td class="col-badge"><span class="badge ${cls}">${pct.toFixed(0)}%</span></td>`;
      } else {
        html += `<td class="${c.type === 'name' ? 'col-name' : ''}">${escapeHtml(raw || '-')}</td>`;
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  return html;
}

// ============================================================
// RENDER SEMUA SLIDE
// ============================================================
let CLEAN_DATA = [];

function renderAllSlides() {
  const clean = CLEAN_DATA;

  // Slide 0: Leaderboard
  renderLeaderboard(clean);

  // Slide 1: Semua SMT
  document.getElementById('fullList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'Target', label: 'Target', type: 'num' },
    { key: 'ACHIEVEMENT', label: 'Achievement', type: 'num' },
    { key: '%', label: '%', type: 'pct' },
    { key: 'KATEGORI', label: 'Kategori', type: 'text' }
  ], 'pct');

  // Slide 2: FURN
  document.getElementById('furnList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'TARGET FURN', label: 'Target FURN', type: 'num' },
    { key: 'ACTUAL FURN', label: 'Actual FURN', type: 'num' },
    { key: '% FURN', label: '% FURN', type: 'pct' },
    { key: '% FURN', label: 'Status', type: 'badge' }
  ], 'pct');

  // Slide 3: ACC
  document.getElementById('accList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'TARGET ACC', label: 'Target ACC', type: 'num' },
    { key: 'ACTUAL ACC', label: 'Actual ACC', type: 'num' },
    { key: '% ACC', label: '% ACC', type: 'pct' },
    { key: '% ACC', label: 'Status', type: 'badge' }
  ], 'pct');

  // Slide 4: FP
  document.getElementById('fpList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'TARGET FP', label: 'Target FP', type: 'num' },
    { key: 'ACTUAL FP', label: 'Actual FP', type: 'num' },
    { key: 'ACTUAL FP', label: 'Incentive FP', type: 'num' }
  ], 'value');

  // Slide 5: COMMSER
  document.getElementById('commserList').innerHTML = buildTable(clean, [
    { key: 'NAMA', label: 'Nama', type: 'name' },
    { key: 'TARGET COMMSER', label: 'Target COMMSER', type: 'num' },
    { key: 'ACTUAL COMMSER', label: 'Actual COMMSER', type: 'num' }
  ], 'value');

  // Slide 6: Summary
  const valid = clean.filter(r => Number(pick(r, 'Target')) > 0);
  const totalTarget = valid.reduce((s, p) => s + (Number(pick(p, 'Target')) || 0), 0);
  const totalAchieve = valid.reduce((s, p) => s + (Number(pick(p, 'ACHIEVEMENT')) || 0), 0);
  const totalPct = totalTarget ? (totalAchieve / totalTarget) * 100 : 0;
  const star = valid.filter(p => badgeClass(pick(p, 'KATEGORI')) === 'star').length;
  const avg  = valid.filter(p => badgeClass(pick(p, 'KATEGORI')) === 'average').length;
  const poor = valid.filter(p => badgeClass(pick(p, 'KATEGORI')) === 'poor').length;

  document.getElementById('summaryGrid').innerHTML = `
    <div class="summary-card"><div class="big-number">${formatCurrency(totalTarget)}</div><div class="label">Total Target</div></div>
    <div class="summary-card"><div class="big-number">${formatCurrency(totalAchieve)}</div><div class="label">Total Achievement</div></div>
    <div class="summary-card"><div class="big-number" style="color:${totalPct>=100?'#4ade80':totalPct>=85?'#facc15':'#f87171'}">${totalPct.toFixed(1)}%</div><div class="label">Overall Achievement</div></div>
    <div class="summary-card"><div class="big-number" style="color:#4ade80">${star}</div><div class="label">⭐ STAR</div></div>
    <div class="summary-card"><div class="big-number" style="color:#facc15">${avg}</div><div class="label">📊 AVERAGE</div></div>
    <div class="summary-card"><div class="big-number" style="color:#f87171">${poor}</div><div class="label">⚠️ POOR</div></div>
  `;
}

// ============================================================
// SLIDE ROTATION + AUTO SCROLL
// ============================================================
const slides = document.querySelectorAll('.slide');
const dotsContainer = document.getElementById('dots');
let currentSlide = 0;
let scrollInterval = null;
let switchTimer = null;

slides.forEach((_, i) => {
  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dotsContainer.appendChild(dot);
});

function setDots(i) {
  document.querySelectorAll('.dot').forEach((d, idx) => d.classList.toggle('active', idx === i));
}

function goToSlide(i) {
  // Stop semua timer yang sedang berjalan
  clearInterval(scrollInterval);
  clearTimeout(switchTimer);

  slides.forEach((s, idx) => s.classList.toggle('active', idx === i));
  setDots(i);
  currentSlide = i;

  // Tunggu sebentar untuk transisi opacity selesai, baru mulai scroll
  setTimeout(() => startSlideTimer(), 900);
}

// Auto-scroll dan auto-switch
function startSlideTimer() {
  const activeSlide = document.querySelector('.slide.active');
  if (!activeSlide) return;

  const scroller = activeSlide.querySelector('.scroller');
  // Jika slide ini tidak pakai scroller (mis. summary), pakai durasi tetap
  if (!scroller) {
    switchTimer = setTimeout(nextSlide, SLIDE_DURATION_NO_SCROLL);
    return;
  }

  // Reset scroll ke atas
  scroller.scrollTop = 0;

  // Ukur apakah perlu scroll
  const maxScroll = scroller.scrollHeight - scroller.clientHeight;

  if (maxScroll <= 5) {
    // Konten pendek → tidak perlu scroll
    switchTimer = setTimeout(nextSlide, SLIDE_DURATION_NO_SCROLL);
    return;
  }

  // Konten panjang → auto scroll pelan
  // Kecepatan: SCROLL_SPEED_PX_PER_SEC px per detik → per 50ms = speed/20 px
  const step = SCROLL_SPEED_PX_PER_SEC / 20;

  scrollInterval = setInterval(() => {
    scroller.scrollTop += step;
    if (scroller.scrollTop >= maxScroll - 1) {
      clearInterval(scrollInterval);
      // Sampai bawah → tahan sebentar → pindah slide
      switchTimer = setTimeout(nextSlide, SCROLL_HOLD_BOTTOM);
    }
  }, 50);
}

function nextSlide() {
  goToSlide((currentSlide + 1) % slides.length);
}

// ============================================================
// JAM (UTC+7)
// ============================================================
function updateClock() {
  document.getElementById('clock').textContent = nowTime();
}
setInterval(updateClock, 1000);
updateClock();

// ============================================================
// INIT & AUTO-REFRESH
// ============================================================
const statusEl = document.getElementById('status');
const errorBox = document.getElementById('errorBox');

async function loadAndRender() {
  try {
    statusEl.textContent = 'Memuat...';
    const table = await fetchSheetData();
    const rows = parseTable(table);
    CLEAN_DATA = rows.filter(r => (pick(r, 'NAMA') || '').toString().trim() !== '');
    if (CLEAN_DATA.length === 0) throw new Error('Tidak ada data di sheet.');

    // Simpan slide aktif saat refresh
    const wasSlide = currentSlide;

    renderAllSlides();

    // Restart slide rotation dari slide yang sedang aktif (agar tidak reset)
    setTimeout(() => startSlideTimer(), 900);

    statusEl.textContent = `✓ ${CLEAN_DATA.length} sales · update ${nowTime()}`;
    errorBox.classList.remove('show');
    console.log('[OK] Data loaded:', CLEAN_DATA.length, 'rows');
  } catch (e) {
    console.error('[ERR]', e);
    statusEl.textContent = '⚠ Gagal memuat';
    errorBox.textContent = '⚠ Gagal memuat data: ' + e.message;
    errorBox.classList.add('show');
  }
}

loadAndRender();

// Mulai rotasi pertama kali setelah data pertama datang
setTimeout(() => startSlideTimer(), 1200);

setInterval(loadAndRender, REFRESH_INTERVAL);
</script>
